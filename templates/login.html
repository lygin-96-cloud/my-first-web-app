<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            color: white;
        }
        .card h2 {
            text-align: center;
            font-weight: 700;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .form-control {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 12px;
            border-radius: 12px;
        }
        .form-control:focus {
            background: rgba(255,255,255,0.1);
            border-color: #a855f7;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
            color: white;
        }
        .btn-primary-custom {
            background: linear-gradient(135deg, #a855f7, #6366f1);
            border: none;
            padding: 12px;
            border-radius: 30px;
            font-weight: 600;
            width: 100%;
            margin-top: 15px;
            transition: 0.3s;
            color: white;
        }
        .btn-primary-custom:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.4);
        }
        .btn-outline-custom {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 30px;
            color: white;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
        }
        .btn-outline-custom:hover {
            background: rgba(255,255,255,0.05);
            border-color: white;
            color: white;
        }
        .text-muted-custom { color: rgba(255,255,255,0.5); }
        .nav-links { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .alert { border-radius: 12px; }
        .alert-danger { background: rgba(220, 53, 69, 0.2); border: 1px solid rgba(220, 53, 69, 0.3); color: #f8d7da; }
    </style>
</head>
<body>
    <div class="card">
        <!-- НАВИГАЦИЯ -->
        <div class="nav-links">
            <a href="/" class="btn-outline-custom">
                <i class="fas fa-arrow-left"></i> На главную
            </a>
            <a href="/register" class="btn-outline-custom">
                <i class="fas fa-user-plus"></i> Регистрация
            </a>
        </div>

        <h2><i class="fas fa-sign-in-alt"></i> Вход</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Логин</label>
                <input class="form-control" name="username" placeholder="Введите логин" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input class="form-control" type="password" name="password" placeholder="Введите пароль" required>
            </div>
            <button class="btn-primary-custom" type="submit">
                <i class="fas fa-arrow-right"></i> Войти
            </button>
        </form>

        <p class="text-center mt-3 text-muted-custom">
            Нет аккаунта? <a href="/register" style="color: #a855f7; text-decoration: none;">Зарегистрируйтесь</a>
        </p>
    </div>
</body>
</html>
