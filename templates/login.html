<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5" style="max-width:400px;">
    <h2 class="text-center">🔐 Вход</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    <form method="POST">
        <input class="form-control mb-2" name="username" placeholder="Логин" required>
        <input class="form-control mb-2" type="password" name="password" placeholder="Пароль" required>
        <button class="btn btn-primary w-100">Войти</button>
    </form>
    <p class="mt-3 text-center"><a href="/register">Нет аккаунта?</a> | <a href="/forgot-password">Забыли пароль?</a></p>
</div>
</body>
</html>
