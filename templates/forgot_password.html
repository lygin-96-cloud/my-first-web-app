<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Восстановление пароля</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5" style="max-width:400px;">
    <h2>🔑 Восстановление пароля</h2>
    <p>Введите ваш логин, и мы отправим ссылку для сброса в Telegram</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}
    <form method="POST">
        <input class="form-control mb-2" name="username" placeholder="Логин" required>
        <button class="btn btn-warning w-100">Отправить</button>
    </form>
    <p class="mt-3 text-center"><a href="/login">Вспомнили пароль?</a></p>
</div>
</body>
</html>
