<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Регистрация</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"></head>
<body>
<div class="container mt-5" style="max-width:400px;">
    <h2>Регистрация</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}<div class="alert alert-{{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    <form method="POST">
        <input class="form-control mb-2" name="username" placeholder="Логин" required>
        <input class="form-control mb-2" type="password" name="password" placeholder="Пароль" required>
        <button class="btn btn-success w-100">Зарегистрироваться</button>
    </form>
    <p class="mt-3"><a href="/login">Уже есть аккаунт?</a></p>
</div>
</body>
</html>
