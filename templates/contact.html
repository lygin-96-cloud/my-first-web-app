<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Контакты</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5" style="max-width: 600px;">
    <h2>📩 Свяжитесь с нами</h2>
    <p>Оставьте свои контакты, и мы перезвоним в течение 15 минут</p>
    <form method="POST">
        <input class="form-control mb-2" name="name" placeholder="Ваше имя" required>
        <input class="form-control mb-2" type="email" name="email" placeholder="Email" required>
        <input class="form-control mb-2" type="tel" name="phone" placeholder="Телефон" required>
        <textarea class="form-control mb-2" name="message" rows="4" placeholder="Опишите задачу" required></textarea>
        <button class="btn btn-primary w-100">Отправить</button>
    </form>
    <a href="/" class="btn btn-secondary w-100 mt-2">На главную</a>
</div>
</body>
</html>
