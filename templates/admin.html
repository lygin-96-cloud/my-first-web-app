<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Админ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"></head>
<body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="/">← Главная</a></div></nav>
<div class="container mt-4">
    <h2>👑 Админ-панель</h2>
    <h4 class="mt-4">📦 Все заказы</h4>
    <ul class="list-group">
        {% for order in orders %}
        <li class="list-group-item d-flex justify-content-between">
            <span>Заказ #{{ order.id }} — {{ order.service }}</span>
            <span class="badge bg-warning">{{ order.status }}</span>
        </li>
        {% else %}
        <li class="list-group-item text-muted">Заказов пока нет</li>
        {% endfor %}
    </ul>
</div>
</body>
</html>
