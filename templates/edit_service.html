<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Редактировать услугу</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4" style="max-width: 500px;">
    <h2>✏️ Редактировать услугу</h2>
    <form method="POST">
        <input class="form-control mb-2" name="title" value="{{ service.title }}" required>
        <textarea class="form-control mb-2" name="description" rows="3">{{ service.description }}</textarea>
        <input class="form-control mb-2" name="price" value="{{ service.price }}" required>
        <input class="form-control mb-2" name="image_url" value="{{ service.image_url or '' }}">
        <button class="btn btn-primary w-100">Сохранить</button>
    </form>
    <a href="/admin" class="btn btn-secondary w-100 mt-2">Назад</a>
</div>
</body>
</html>
