<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Профиль</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"></head>
<body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="/">← На главную</a></div></nav>
<div class="container mt-4">
    <h2>👋 Привет, {{ current_user.username }}</h2>
    <h4 class="mt-4">📋 Мои заказы</h4>
    <ul class="list-group">
        {% for order in orders %}
        <li class="list-group-item d-flex justify-content-between">
            <span>{{ order.service }}</span>
            <span class="badge bg-primary">{{ order.status }}</span>
        </li>
        {% else %}
        <li class="list-group-item text-muted">У вас пока нет заказов</li>
        {% endfor %}
    </ul>
</div>
</body>
</html>
