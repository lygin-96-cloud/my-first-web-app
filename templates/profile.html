<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0b0b1a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .profile-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
        }
        .profile-card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #a855f7;
            margin-bottom: 16px;
        }
        .profile-card h2 { color: white; font-weight: 700; }
        .profile-card p { color: rgba(255,255,255,0.4); }
        .profile-card input {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            width: 100%;
            max-width: 400px;
            margin: 8px auto;
            display: block;
        }
        .profile-card input:focus { outline: none; border-color: #a855f7; }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: white;
        }
        .btn:hover { transform: scale(1.03); }
        .btn-secondary { background: rgba(255,255,255,0.05); color: white; }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }
        .orders-list {
            margin-top: 30px;
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            padding: 20px;
        }
        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .order-item:last-child { border-bottom: none; }
        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(168, 85, 247, 0.2);
            color: #a855f7;
        }
        .badge-done { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
        .badge-work { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            margin-bottom: 30px;
        }
        .navbar a {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            transition: 0.3s;
        }
        .navbar a:hover { color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="navbar">
            <a href="/"><i class="fas fa-arrow-left"></i> На главную</a>
            <a href="/logout" style="color:#ef4444;">Выйти</a>
        </div>

        <div class="profile-card">
            <img src="{{ user.avatar or 'https://ui-avatars.com/api/?name=' + user.username }}" alt="Аватар">
            <h2>{{ user.username }}</h2>
            <p>{{ user.email or 'Email не указан' }}</p>
            <form method="POST">
                <input type="email" name="email" placeholder="Email" value="{{ user.email or '' }}">
                <button class="btn">Обновить профиль</button>
            </form>
        </div>

        <div class="orders-list">
            <h3 style="color:white; margin-bottom:16px;">📋 Мои заказы</h3>
            {% for order in orders %}
            <div class="order-item">
                <div>
                    <strong>{{ order.service }}</strong>
                    <span style="color:rgba(255,255,255,0.3); font-size:14px; margin-left:12px;">{{ order.created_at.strftime('%d.%m.%Y') }}</span>
                </div>
                <span class="badge badge-{{ 'done' if order.status == 'Завершён' else 'work' if order.status == 'В работе' else '' }}">{{ order.status }}</span>
            </div>
            {% else %}
            <p style="color:rgba(255,255,255,0.3); text-align:center; padding:20px 0;">У вас пока нет заказов</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
